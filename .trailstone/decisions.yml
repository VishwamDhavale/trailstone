# Trailstone decision ledger. One entry per decision: what was decided, why, and the
# paths it governs. Decisions are immutable — reverse one with a new entry carrying
# `supersedes: <id>`. Editing this file in a PR IS the review.
- kind: goal
  id: g_f418f51a
  at: 2026-09-06T18:18:33.516Z
  by: vishwamdhavale
  decision: "A decision ledger that lives in your repo: one stdlib script, one YAML file, no server. It surfaces the decisions governing the file in hand and blocks work that rests on a reversed one."
- id: d_8c11f040
  at: 2026-09-06T18:18:33.604Z
  by: vishwamdhavale
  decision: The ledger is a YAML file in the repo (.trailstone/decisions.yml), not a hosted database
  why: git already gives provenance, membership, ratification and audit; a hosted ledger blocks the team case it is meant to serve
  scope:
    - trailstone.mjs
- id: d_756ad0cd
  at: 2026-09-09T15:07:11.755Z
  by: vishwamdhavale
  decision: decide/reverse print blast radius (files the scope covers) at record time, and the README states a flag means 'governed by' not 'broken' and that git revert fires nothing
  why: Real reversal on a directory scope flags every file under it; measured 1 of 9 flagged files actually needed rework on real agent work (8 held). Showing the file count at decide time lets the user narrow scope before the noisy reversal; honest README wording prevents the 'exactly which is broken' overclaim that gets a tool uninstalled after the first noisy flag.
  scope:
    - trailstone.mjs
    - README.md
- id: d_a1e538ce
  at: 2026-09-18T12:26:16.249Z
  by: vishwamdhavale
  decision: MCP server mode (trailstone mcp) plus an AGENTS.md/Cursor rules file are the cross-agent path; unasked pre-edit PUSH stays Claude Code only until a harness ships a hook API.
  why: "Validated live on 4 harnesses: Claude Code (hooks), Codex CLI, Cursor and Claude Desktop (MCP). Codex, Cursor and Claude Desktop each independently refused to build on a stale file. ChatGPT desktop has no local stdio MCP and would need the HTTP transport."
  scope:
    - trailstone.mjs
    - README.md
- id: d_f3bf68a1
  at: 2026-09-18T12:26:16.324Z
  by: vishwamdhavale
  decision: "MCP tools take an optional repo argument and resolve the repo per call: repo arg, then an absolute file path, then --repo/TRAILSTONE_REPO, then cwd. The no-repo error tells the agent to pass repo."
  why: Cursor launches the MCP server from the HOME workspace, not the folder you opened, so cwd alone returned 'not inside a git repository' while sitting in a real project. With the actionable error, the Cursor agent self-corrected and retried with the path unaided.
  scope:
    - trailstone.mjs
- id: d_81600b3c
  at: 2026-09-18T12:35:33.830Z
  by: vishwamdhavale
  decision: hasClaude uses where/which instead of `sh -c command -v`, so capture detection works on Windows; and the selfcheck carries a foreign-cwd MCP client profile.
  why: "sh does not exist on Windows, so passive capture silently disabled itself for every Windows user (failing safe, but failing). The foreign-cwd profile locks in the Cursor bug: Cursor launches the server from the home workspace, not the opened folder."
  scope:
    - trailstone.mjs
- id: d_2af86789
  at: 2026-09-18T12:41:12.040Z
  by: vishwamdhavale
  decision: All generated shell commands (Claude Code hook entries, the pre-push hook) quote the script path and use forward slashes via SELF_CMD, and the selfcheck asserts it.
  why: "Unquoted paths broke all four hooks for anyone whose path contains a space (/Users/My Name/..., C:\\Users\\John Doe\\...) — silently, so Trailstone looked installed and said nothing. Backslashes additionally break the sh pre-push script under git-bash on Windows. Verified: the assertion fails when the bug is reintroduced, and install into a spaced home now runs cleanly."
  scope:
    - trailstone.mjs
- id: d_71252ec1
  at: 2026-09-18T12:48:31.774Z
  by: vishwamdhavale
  decision: Support node 20.17+ on macOS, Windows and Linux, proven by a 3-OS x 3-node CI matrix rather than by hand; a node without path.matchesGlob warns loudly on the CLI (never in a hook).
  why: engines was >=22.5 for no reason, excluding node 20 LTS users. Below 20.17 matchesGlob is undefined, the try/catch swallows it, and every glob scope silently governs NOTHING — a precision tool failing quiet. Verified selfcheck + demo + a real hook (0 bytes stderr) on node 20.20.
  scope:
    - trailstone.mjs
    - package.json
    - .github/workflows/ci.yml
- id: d_d1f2a3de
  at: 2026-09-18T13:10:21.443Z
  by: vishwamdhavale
  decision: Repo-relative paths are always forward-slashed (toPosix), matching what git emits and what ledger scopes are written with.
  why: "On Windows node's relative() returns backslashes, so the hook computed src\\auth\\session.js and matched no forward-slash scope: it surfaced nothing and said nothing — a silent failure on a whole platform. stale() was unaffected because it reads git ls-files directly, which is why only one selfcheck assertion caught it. Found by the 3-OS CI matrix on the first push."
  scope:
    - trailstone.mjs
- id: d_83dbd17c
  at: 2026-09-18T14:20:25.974Z
  by: vishwamdhavale
  decision: doctor counts hook entries structurally (parse settings.json, match basename + trailing 'hook'), never by regex over the serialised JSON.
  why: install began quoting the script path, so the old /trailstone.mjs hook/ regex matched nothing and doctor reported 0/4 hooks while all four were live — a false 'not watching' in the one command whose job is answering that question. Found while migrating a real project. Selfcheck now asserts doctor sees what install wrote, and the assertion was verified to fail when the regex form is restored.
  scope:
    - trailstone.mjs
- id: d_c904d456
  at: 2026-09-18T17:19:34.097Z
  by: vishwamdhavale
  decision: Licence is Apache-2.0 from 0.2.0 on, not MIT (0.1.0 stays MIT for anyone who took it).
  why: Apache-2.0 is equally permissive but adds an express patent grant and, via section 5, unambiguous inbound contribution terms — no CLA needed for a project that actively solicits PRs — and it clears corporate legal review faster. It does NOT protect the idea from competitors; no licence does. Switched while pre-public with zero external contributors, which is the cheapest moment it will ever be.
  scope:
    - LICENSE
    - package.json
    - CONTRIBUTING.md
- id: d_47c47993
  at: 2026-09-18T17:36:24.747Z
  by: vishwamdhavale
  decision: Tag a release from the exact commit being published, at publish time — never tag ahead of a release.
  why: v0.1.0 was tagged on the first commit but npm 0.1.0 was published four commits later, so 'git checkout v0.1.0' and 'npm i trailstone@0.1.0' gave different bytes and the published artifact was not reproducible from the repo. The tag has been moved to the commit npm actually shipped.
  scope:
    - package.json
    - CHANGELOG.md
- id: d_fc1430d2
  at: 2026-09-18T17:55:24.932Z
  by: vishwamdhavale
  decision: stale() builds last-commit times with ONE git log for the repo, not git log -1 per file; git calls carry an explicit maxBuffer.
  why: Per-file spawning took 11.3s on a 2000-file scope inside a hook that runs on every prompt — a direct breach of the never-slow-a-prompt contract. One log scan is 0.13s with identical results. Separately, git() had no maxBuffer, so ls-files on a ~30k-file repo blew node's 1MB default, threw, was caught, and staleness silently stopped firing.
  scope:
    - trailstone.mjs
- id: d_3e490159
  at: 2026-09-18T17:55:25.043Z
  by: vishwamdhavale
  decision: Ship an uninstall command that removes the hooks and pre-push but never the ledger or AGENTS.md.
  why: The tool writes into ~/.claude/settings.json and .git/hooks; without a way out people must hand-edit JSON to remove it. Decisions and repo content are the user's, so uninstall does not touch them.
  scope:
    - trailstone.mjs
- id: d_dbf147f1
  at: 2026-09-18T19:03:23.591Z
  by: vishwamdhavale
  decision: Read VERSION from package.json at startup, with the literal only as a fallback for a bare script copy
  why: "The hardcoded literal drifted: published 0.2.0 announced itself as 0.1.0 to every MCP client and stamped 0.1.0 on every report --anon, misattributing the one metric we ask users to send back. Selfcheck now asserts the two agree."
  scope:
    - trailstone.mjs
- id: d_998e659d
  at: 2026-09-18T19:03:23.706Z
  by: vishwamdhavale
  decision: Help and --version answer outside a git repository; only real commands hit the repo guard, and its message names the fix
  why: Outside a repo is exactly where a fresh npm i -g is first run, and every command including --help answered 'not a git repo' with no guidance — the worst possible first impression for a tool whose whole pitch is legibility.
  scope:
    - trailstone.mjs
- id: d_3c2caad8
  at: 2026-09-18T19:33:27.144Z
  by: vishwamdhavale
  decision: install announces what it could not wire when run outside a repo, and the README puts 'cd your-repo' first
  why: Following the README literally left a user with the advisory half and no pre-push guard — enforcement silently absent while everything looked installed. Silent loss of the gate is the worst failure this tool can have after a false flag.
  scope:
    - trailstone.mjs
    - README.md
