- id: d_756ad0cd
  at: 2026-09-09T15:07:11.755Z
  by: vishwamdhavale
  decision: decide/reverse print blast radius (files the scope covers) at record time, and the README states a flag means 'governed by' not 'broken' and that git revert fires nothing
  why: Real reversal on a directory scope flags every file under it; measured 1 of 9 flagged files actually needed rework on real agent work (8 held). Showing the file count at decide time lets the user narrow scope before the noisy reversal; honest README wording prevents the 'exactly which is broken' overclaim that gets a tool uninstalled after the first noisy flag.
  scope:
    - trailstone.mjs
    - README.md
