name: ci
on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Trailstone installs itself into people's prompt path and their push gate, on
        # whatever machine they use. It gets tested on all three, at the oldest supported
        # node and the newest. path.matchesGlob needs >= 20.17, which is the floor.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: node trailstone.mjs --selfcheck
      - run: node trailstone.mjs demo

  gate:
    name: trailstone gates itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the guard compares commit dates; it needs the history
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node trailstone.mjs stale
